name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 只需要读仓库 + 写 Pages 部署，不给多余权限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；排队中的旧任务可以取消，正在进行的部署不打断。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate story data
        run: npm run validate:story

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 仓库 Settings → Pages 的 Source 必须先设成 GitHub Actions。
      # 不使用 configure-pages 的 `enablement`：GITHUB_TOKEN 没有建站权限，
      # 开着只会让每次构建都以 "Resource not accessible by integration" 失败。
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
